openapi: 3.0.3
info:
  title: Do Campo à Mesa API
  version: 0.1.0
  description: API REST do mercado digital de produtores locais.
servers:
  - url: http://localhost:3000/api
tags:
  - name: Autenticação
    description: Registo, login e sessão
  - name: Produtos
    description: Catálogo de produtos
paths:
  /auth/registo:
    post:
      tags: [Autenticação]
      summary: Registar comprador ou produtor
      description: Um produtor fica com `produtor.validado = false` até o administrador o aprovar. O papel `admin` não pode ser pedido.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistoInput' }
      responses:
        '201':
          description: Utilizador criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '409':
          description: Já existe um utilizador com esse email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autenticar e obter o token JWT
      description: Use o token no botão **Authorize** (esquema bearerAuth) para testar os endpoints protegidos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResposta' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /auth/eu:
    get:
      tags: [Autenticação]
      summary: Dados do utilizador autenticado
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Utilizador autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Utilizador' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
  /products:
    get:
      tags: [Produtos]
      summary: Pesquisar produtos
      parameters:
        - { name: q, in: query, description: Texto no nome, schema: { type: string } }
        - { name: categoria, in: query, schema: { type: string } }
        - { name: precoMax, in: query, schema: { type: number } }
        - { name: bio, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
    post:
      tags: [Produtos]
      summary: Criar produto (produtor)
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201': { description: Produto criado }
        '400': { description: Dados inválidos }
        '401': { description: Token em falta ou inválido }
        '403': { description: Utilizador não é produtor }
  /products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Produtos]
      summary: Detalhe de um produto
      responses:
        '200':
          description: Produto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { description: Não encontrado }
    put:
      tags: [Produtos]
      summary: Atualizar produto (produtor dono)
      security: [ { bearerAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200': { description: Produto atualizado }
        '404': { description: Não encontrado }
    delete:
      tags: [Produtos]
      summary: Remover produto (produtor dono)
      security: [ { bearerAuth: [] } ]
      responses:
        '204': { description: Removido }
        '404': { description: Não encontrado }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    DadosInvalidos:
      description: Dados inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    NaoAutenticado:
      description: Token em falta ou inválido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
  schemas:
    Erro:
      type: object
      properties:
        erro: { type: string, example: Credenciais inválidas }
    RegistoInput:
      type: object
      required: [nome, email, password]
      properties:
        nome: { type: string, example: Tasca do Lima }
        email: { type: string, format: email, example: novo@exemplo.pt }
        password: { type: string, format: password, minLength: 8, example: segredo123 }
        papel: { type: string, enum: [comprador, produtor], default: comprador }
        produtor:
          type: object
          description: Só para papel = produtor
          properties:
            nomeExploracao: { type: string }
            descricao: { type: string }
            localidade: { type: string }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: tasca@exemplo.pt }
        password: { type: string, format: password, example: password123 }
    Utilizador:
      type: object
      properties:
        id: { type: string }
        nome: { type: string }
        email: { type: string }
        papel: { type: string, enum: [comprador, produtor, admin] }
        produtor:
          type: object
          properties:
            nomeExploracao: { type: string }
            descricao: { type: string }
            localidade: { type: string }
            validado: { type: boolean }
    LoginResposta:
      type: object
      properties:
        token: { type: string }
        utilizador: { $ref: '#/components/schemas/Utilizador' }
    ProductInput:
      type: object
      required: [nome, categoria, preco]
      properties:
        nome: { type: string, example: Kiwi Hayward }
        categoria: { type: string, enum: [Hortícolas, Fruta, Mel, Vinho, Queijo, Padaria, Outros] }
        preco: { type: number, example: 2.4 }
        unidade: { type: string, example: kg }
        stock: { type: integer, example: 300 }
        biologico: { type: boolean }
        epocas: { type: array, items: { type: string } }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          properties:
            _id: { type: string }
            produtor: { type: string, description: Id do produtor (ou objeto com populate) }
            imagemUrl: { type: string }
    # TODO: Order, Auction, Bid, Review
